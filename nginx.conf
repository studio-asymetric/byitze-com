server {
    listen 80;
    server_name www.byitze.com;
    return 301 https://byitze.com$request_uri;
}

server {
    listen 80 default_server;
    server_name byitze.com;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml text/xml image/webp;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://byitze.com$request_uri;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.woff2$ {
        default_type font/woff2;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /contact {
        return 301 https://byitze.com/#contact;
    }

    location = /contact/ {
        return 301 https://byitze.com/#contact;
    }

    location = /about {
        return 301 https://byitze.com/#about;
    }

    location = /about/ {
        return 301 https://byitze.com/#about;
    }

    location = /work {
        return 301 https://asymetric.studio/work/;
    }

    location = /work/ {
        return 301 https://asymetric.studio/work/;
    }

    location ~ ^/work/([a-z0-9-]+)/?$ {
        return 301 https://asymetric.studio/work/$1/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
